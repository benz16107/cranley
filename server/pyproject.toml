[project]
name = "threshold"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "numpy>=2.0",
  "shapely>=2.0",
  "pillow>=10.4",
  "deepagents>=0.7.38",
  "langchain-anthropic>=1.7.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
