[project]
name = "threshold"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "numpy>=2.0",
  "shapely>=2.0",
  "pillow>=10.4",
  "pyzipper>=0.4.0",
  "anthropic>=2.8",
  "deepagents>=0.7.38",
  "langchain-anthropic>=1.7.10",
  "pg8000>=1.31",
  "fastembed>=0.9.1",
  "pymongo>=4.20.0",
  "segno>=1.6.6",
  "cryptography>=44",
  "langgraph-checkpoint-mongodb>=0.5.1",
  "langchain-mcp-adapters>=0.3.2",
  "pgai>=0.12.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
